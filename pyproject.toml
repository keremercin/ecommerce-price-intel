[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-price-intel"
version = "0.1.0"
description = "Price tracking and trend intelligence pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "streamlit>=1.37.0",
  "pandas>=2.2.2",
  "sqlalchemy>=2.0.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "ruff>=0.5.6",
  "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["src"]
